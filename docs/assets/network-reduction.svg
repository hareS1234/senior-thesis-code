<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Energy landscape and kinetic network reduction</title>
  <desc id="desc">An energy profile maps to a microscopic kinetic transition network. Graph transformation removes selected states and produces effective rates between retained states.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16324f" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7890a8"/>
    </marker>
    <marker id="smallArrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L6,3.5 L0,7 Z" fill="#567087"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg2)"/>
  <text x="52" y="57" fill="#16324f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">FROM WELLS TO A SMALLER KINETIC NETWORK</text>
  <text x="52" y="87" fill="#60758a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Minima define states. Transition states define possible moves. Effective rates carry the removed paths.</text>

  <g filter="url(#shadow2)">
    <rect x="40" y="118" width="338" height="300" rx="20" fill="#ffffff"/>
    <rect x="431" y="118" width="338" height="300" rx="20" fill="#ffffff"/>
    <rect x="822" y="118" width="338" height="300" rx="20" fill="#ffffff"/>
  </g>

  <text x="66" y="153" fill="#e78d43" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1">01 · ENERGY LANDSCAPE</text>
  <line x1="76" y1="368" x2="344" y2="368" stroke="#d8e2ec" stroke-width="1.5"/>
  <text x="71" y="184" fill="#7890a8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">ENERGY</text>
  <path d="M77 336 C103 334, 104 250, 137 251 C170 252, 165 324, 203 326 C239 328, 230 214, 270 218 C307 222, 305 312, 343 316" fill="none" stroke="#355c7d" stroke-width="4" stroke-linecap="round"/>
  <line x1="137" y1="251" x2="137" y2="208" stroke="#f4a261" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="137" y="198" text-anchor="middle" fill="#b66c31" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">transition state</text>
  <circle cx="77" cy="336" r="13" fill="#20a39e" stroke="#ffffff" stroke-width="4"/>
  <circle cx="203" cy="326" r="10" fill="#4c86b7" stroke="#ffffff" stroke-width="4"/>
  <circle cx="270" cy="218" r="10" fill="#4c86b7" stroke="#ffffff" stroke-width="4"/>
  <circle cx="343" cy="316" r="13" fill="#ef6f6c" stroke="#ffffff" stroke-width="4"/>
  <text x="77" y="397" text-anchor="middle" fill="#168f8a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">A</text>
  <text x="343" y="397" text-anchor="middle" fill="#d95350" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">B</text>
  <text x="203" y="351" text-anchor="middle" fill="#60758a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">minimum</text>

  <text x="457" y="153" fill="#2f80ed" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1">02 · MICROSCOPIC KTN</text>
  <g fill="none" stroke="#91a4b6" stroke-width="2" marker-end="url(#smallArrow)">
    <path d="M489 275 L548 217"/><path d="M550 226 L500 280"/>
    <path d="M563 209 L632 190"/><path d="M628 200 L567 218"/>
    <path d="M648 197 L708 247"/><path d="M704 257 L645 207"/>
    <path d="M494 291 L562 337"/><path d="M558 326 L500 286"/>
    <path d="M578 334 L651 315"/><path d="M648 325 L581 343"/>
    <path d="M666 309 L721 280"/><path d="M714 291 L669 316"/>
    <path d="M558 229 L571 326"/><path d="M579 326 L566 229"/>
    <path d="M640 204 L659 300"/><path d="M667 298 L648 205"/>
    <path d="M576 214 L653 305"/>
  </g>
  <circle cx="488" cy="288" r="18" fill="#20a39e" stroke="#ffffff" stroke-width="4"/>
  <circle cx="559" cy="215" r="13" fill="#4c86b7" stroke="#ffffff" stroke-width="4"/>
  <circle cx="640" cy="194" r="11" fill="#7ea9cb" stroke="#ffffff" stroke-width="4"/>
  <circle cx="717" cy="264" r="18" fill="#ef6f6c" stroke="#ffffff" stroke-width="4"/>
  <circle cx="570" cy="341" r="10" fill="#9bbbd3" stroke="#ffffff" stroke-width="4"/>
  <circle cx="660" cy="313" r="13" fill="#4c86b7" stroke="#ffffff" stroke-width="4"/>
  <text x="488" y="293" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800">A</text>
  <text x="717" y="269" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800">B</text>
  <text x="600" y="389" text-anchor="middle" fill="#60758a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Each minimum becomes a node.</text>

  <text x="848" y="153" fill="#168f8a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1">03 · GT-KEPT KTN</text>
  <g fill="none" stroke="#567087" stroke-linecap="round">
    <path d="M871 281 C920 204, 982 195, 1024 247" stroke-width="7" opacity="0.72"/>
    <path d="M872 291 C927 356, 995 350, 1030 291" stroke-width="5" opacity="0.62"/>
    <path d="M1034 254 C1065 241, 1091 249, 1111 272" stroke-width="7" opacity="0.72"/>
    <path d="M1036 286 C1065 304, 1091 302, 1113 286" stroke-width="5" opacity="0.62"/>
  </g>
  <circle cx="868" cy="286" r="23" fill="#20a39e" stroke="#ffffff" stroke-width="5"/>
  <circle cx="1033" cy="270" r="18" fill="#355c7d" stroke="#ffffff" stroke-width="5"/>
  <circle cx="1119" cy="280" r="23" fill="#ef6f6c" stroke="#ffffff" stroke-width="5"/>
  <text x="868" y="292" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800">A</text>
  <text x="1033" y="276" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800">R</text>
  <text x="1119" y="286" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="800">B</text>
  <text x="991" y="389" text-anchor="middle" fill="#60758a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Removed paths become effective rates.</text>

  <path d="M387 267 H416" stroke="#7890a8" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <path d="M778 267 H807" stroke="#7890a8" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <rect x="40" y="450" width="1120" height="78" rx="18" fill="#16324f"/>
  <text x="72" y="482" fill="#b9d2e8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MARKOV CONVENTION</text>
  <text x="72" y="509" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Bᵢⱼ = Kᵢⱼ τⱼ</text>
  <line x1="265" y1="470" x2="265" y2="510" stroke="#48637c"/>
  <text x="300" y="496" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Q = K − diag(τ⁻¹)</text>
  <line x1="552" y1="470" x2="552" y2="510" stroke="#48637c"/>
  <text x="587" y="496" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Qπ = 0</text>
  <line x1="721" y1="470" x2="721" y2="510" stroke="#48637c"/>
  <text x="756" y="496" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">q<tspan baseline-shift="sub" font-size="12">A</tspan> = 0</text>
  <text x="844" y="496" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">q<tspan baseline-shift="sub" font-size="12">B</tspan> = 1</text>
  <line x1="930" y1="470" x2="930" y2="510" stroke="#48637c"/>
  <text x="965" y="496" fill="#7de0d4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="750">Endpoint MFPTs retained</text>
</svg>
